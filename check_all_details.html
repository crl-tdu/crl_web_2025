<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Check All Detail Files</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .loading { color: orange; }
    </style>
</head>
<body>
    <h1>Checking All Detail Files</h1>
    <div id="status" class="loading">Loading project.json...</div>
    <div id="results"></div>
    
    <script>
        async function checkAllDetailFiles() {
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            
            try {
                // Load project.json
                const response = await fetch('project.json');
                const data = await response.json();
                const projects = data.projects;
                
                statusEl.textContent = `Checking ${projects.length} projects...`;
                statusEl.className = 'loading';
                
                let successCount = 0;
                let errorCount = 0;
                let results = '<table border="1" cellpadding="5"><tr><th>ID</th><th>Path</th><th>Status</th><th>Size</th></tr>';
                
                for (const project of projects) {
                    if (project.detail_file) {
                        try {
                            const detailResponse = await fetch(project.detail_file);
                            if (detailResponse.ok) {
                                const text = await detailResponse.text();
                                results += `<tr class="success">
                                    <td>${project.id}</td>
                                    <td>${project.detail_file}</td>
                                    <td>✓ OK</td>
                                    <td>${text.length} chars</td>
                                </tr>`;
                                successCount++;
                            } else {
                                results += `<tr class="error">
                                    <td>${project.id}</td>
                                    <td>${project.detail_file}</td>
                                    <td>✗ ${detailResponse.status} ${detailResponse.statusText}</td>
                                    <td>-</td>
                                </tr>`;
                                errorCount++;
                            }
                        } catch (err) {
                            results += `<tr class="error">
                                <td>${project.id}</td>
                                <td>${project.detail_file}</td>
                                <td>✗ ${err.message}</td>
                                <td>-</td>
                            </tr>`;
                            errorCount++;
                        }
                    } else {
                        results += `<tr class="error">
                            <td>${project.id}</td>
                            <td>NO PATH</td>
                            <td>✗ Missing path</td>
                            <td>-</td>
                        </tr>`;
                        errorCount++;
                    }
                }
                
                results += '</table>';
                
                statusEl.textContent = `Complete: ${successCount} success, ${errorCount} errors`;
                statusEl.className = errorCount > 0 ? 'error' : 'success';
                resultsEl.innerHTML = results;
                
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                statusEl.className = 'error';
            }
        }
        
        checkAllDetailFiles();
    </script>
</body>
</html>
